[package]
name = "pripps"
version = "0.1.0"
edition = "2024"
description = "Partial Rust Implementation of PePSi"
authors = ["Mikael Lund <lyssky@icloud.com>"]
repository = "https://github.com/mlund/pripps"
documentation = "https://docs.rs/pripps"
readme = "README.md"
license = "Apache-2.0"
categories = ["science"]
keywords = ["debye_formula", "chemistry", "scattering_intensity", "proteins"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
thiserror = "2"
indicatif = { version = "0.17", optional = true }
itertools = "0.14"
log = "0.4"
molly = "0.6"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
num-complex = "0.4.6"
pretty_env_logger = { version = "0.5", optional = true }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10"
voronota-ltr = { git = "https://github.com/mlund/voronota-ltr" }

# GPU (wgpu) Direct Fourier transform — see `gpu` feature below.
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
tempfile = "3"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:pretty_env_logger", "dep:indicatif"]
# GPU-accelerated Direct Fourier transform via wgpu/WGSL.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[[bin]]
name = "pripps"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "intensity"
harness = false

[workspace]
members = ["pripps-py"]

[profile.release]
strip = true # Automatically strip symbols from the binary.
#lto = true   # Link-time optimization

[profile.profiling]
inherits = "release"
strip = false
debug = true
