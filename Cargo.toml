[package]
name = "pripps"
version = "0.1.0"
edition = "2024"
description = "Partial Rust Implementation of PePSi"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
const_soft_float = "0.1.4"
faunus = { path = "../faunus-rs/faunus" }
itertools = "0.14.0"
log = "0.4.26"
nalgebra = "0.33.2"
pretty_env_logger = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
