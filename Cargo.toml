[package]
name = "pripps"
version = "0.1.0"
edition = "2024"
description = "Partial Rust Implementation of PePSi"
authors = ["Mikael Lund <lyssky@icloud.com>"]
repository = "https://github.com/mlund/pripps"
documentation = "https://docs.rs/pripps"
readme = "README.md"
license = "Apache-2.0"
categories = ["science"]
keywords = ["debye_formula", "chemistry", "scattering_intensity", "proteins"]

[dependencies]
clap = { version = "4.5.32", features = ["derive"], optional = true }
thiserror = "2"
indicatif = { version = "0.17.11", optional = true }
itertools = "0.14.0"
log = "0.4.26"
molly = "0.3.3"
nalgebra = "0.33.2"
num-complex = "0.4.6"
pretty_env_logger = { version = "0.5.0", optional = true }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
voronota-ltr = "0.4.0"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.5"
tempfile = "3"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:pretty_env_logger", "dep:indicatif"]

[[bin]]
name = "pripps"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "intensity"
harness = false

[workspace]
members = ["pripps-py"]

[profile.release]
strip = true # Automatically strip symbols from the binary.
#lto = true   # Link-time optimization
