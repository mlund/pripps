[package]
name = "pripps"
version = "0.1.0"
edition = "2024"
description = "Partial Rust Implementation of PePSi"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
faunus = { git = "https://github.com/mlund/faunus-rs" }
indicatif = { version = "0.17.11" }
itertools = "0.14.0"
log = "0.4.26"
molly = "0.3.3"
nalgebra = "0.33.2"
pretty_env_logger = "0.5.0"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
approx = "0.5.1"

[profile.release]
strip = true # Automatically strip symbols from the binary.
lto = true   # Link-time optimization
