# bead scattering and the displaced bulk solvent is stored next to it as
# `excluded_solvent`. Use with `--excluded per-kind`, which subtracts the
# excluded-solvent term (scaled by `volume_scale`) at recombination.
#
# For the variant with the excluded solvent already folded into a single
# form factor, see poly_amino_acid_combined.yaml.
#
# Form-factor coefficients updated from poly_amino_acid.csv. Coefficients
# preserve all significant digits from the CSV source.
#

