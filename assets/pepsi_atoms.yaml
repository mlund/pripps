  {
    radius: 0.84,
    ff:
      !Gaussian {
        qrange: [0.0, 6.0],
        ab:
          [
            [11.89378, 0.000158],
            [3.277479, 10.232723],
            [1.858092, 30.34469],
            [0.858927, 0.656065],
            [0.912985, 0.217287],
          ],
        c: -11.8049,
