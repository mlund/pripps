#
# FoXS-compatible form factors (Cromer-Mann, International Tables Vol. C)
#
# b values are in the standard s² = (q/4π)² convention used by
# International Tables, PepsiSAXS, and FoXS. pripps's eval_gaussian
# converts to this convention internally.
#
# Excluded volumes match FoXS (FormFactorTable.cpp / IMP-SAXS).
# Use with `--excluded foxs` for the FoXS-compatible pipeline.
#
# Units: length (Å), volume (ų), wave vector q (Å⁻¹)
#

# --- Elements ---

H:
  {
    radius: 1.07,
    displaced_volume: 5.15,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[0.493002, 10.5109], [0.322912, 26.1257], [0.140191, 3.14236], [0.040810, 57.7997]], c: 0.003038 },
  }
C:
  {
    radius: 1.58,
    displaced_volume: 16.44,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[2.31000, 20.8439], [1.02000, 10.2075], [1.58860, 0.56870], [0.86500, 51.6512]], c: 0.215600 },
  }
N:
  {
    radius: 0.84,
    displaced_volume: 2.49,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[12.2126, 0.00570], [3.13220, 9.89330], [2.01250, 28.9975], [1.16630, 0.58260]], c: -11.529 },
  }
O:
  {
    radius: 1.30,
    displaced_volume: 9.13,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[3.04850, 13.2771], [2.28680, 5.70110], [1.54630, 0.32390], [0.86700, 32.9089]], c: 0.250800 },
  }
S:
  {
    radius: 1.68,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[6.90530, 1.46790], [5.20340, 22.2151], [1.43790, 0.25360], [1.58630, 56.1720]], c: 0.866900 },
  }
P:
  {
    radius: 1.11,
    ff: !Gaussian { qrange: [0.0, 2.0], ab: [[6.43450, 1.90670], [4.17910, 27.1570], [1.78000, 0.52600], [1.49080, 68.1645]], c: 1.114900 },
  }

# --- United atoms (formed by adding H contributions to heavy atoms) ---

CH:  { radius: 1.73, ff: !United { center: C, orbit: [[H, 1.099, 1]] } }
CH2: { radius: 1.85, ff: !United { center: C, orbit: [[H, 1.092, 2]] } }
CH3: { radius: 1.97, ff: !United { center: C, orbit: [[H, 1.059, 3]] } }
CaromH: { radius: 1.73, ff: !United { center: C, orbit: [[H, 1.083, 1]] } }
Csp2H:  { radius: 1.73, ff: !United { center: C, orbit: [[H, 1.077, 1]] } }

# NH/SH radii derived from displaced volume: r = (3V/(4π))^(1/3),
# matching FoXS's `get_radius` which computes the SASA sphere
# radius from the excluded volume, not from the bond length.
NH:  { radius: 1.222, displaced_volume: 7.64, ff: !United { center: N, orbit: [[H, 1.009, 1]] } }
NH2: { radius: 1.451, displaced_volume: 12.79, ff: !United { center: N, orbit: [[H, 1.009, 2]] } }
NH3: { radius: 1.624, displaced_volume: 17.94, ff: !United { center: N, orbit: [[H, 0.78508, 3]] } }

SH:  { radius: 1.814, displaced_volume: 25.01, ff: !United { center: S, orbit: [[H, 1.43, 1]] } }
OH:  { radius: 1.50, ff: !United { center: O, orbit: [[H, 0.967, 1]] } }

H2O: { radius: 1.93, ff: !United { center: O, orbit: [[H, 0.9584, 2]] } }

# --- Aliases for backward compatibility ---

SE: { radius: 1.68, ff: !Alias S }
